name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # The gate FAILS the build only on CRITICAL findings (the final
        # `npm audit --audit-level=critical` line). The HIGH-severity audit
        # (`npm audit --audit-level=high`) runs under `set +e` purely to keep
        # the HIGH findings visible in the log — it is not an enforcement
        # boundary. That split exists because `npm audit` reports advisories
        # against transitive dependencies the workspace overrides map cannot
        # reach: a nested private deepmerge-ts (GHSA-ggr8-5vv4-36mx) behind
        # `@prisma/config`, a `tinypool`/`proxy-addr` pair, and a set of
        # HIGH-severity findings across dev dependencies. A patch-level
        # prisma/vitest upgrade is the clean resolution (tracked in
        # CODE_REVIEW_REPORT.md).
        run: |
          set +e
          npm audit --audit-level=high
          high_failed=$?
          # Surface the full advisory table when the high-level audit reports
          # findings, so HIGH-severity issues stay visible in CI without
          # failing the build on the known advisories.
          if [ "$high_failed" -ne 0 ]; then
            npm audit
          fi
          # Fail the build on CRITICAL vulnerabilities (defense-in-depth: a
          # critical finding always fails even if the high-level report was
          # only a known issue).
          npm audit --audit-level=critical

      - name: Cache Prisma client
        id: prisma-cache
        uses: actions/cache@v4
        with:
          # npm workspace hoisting installs @prisma/client (and therefore the
          # generated client) at the REPO ROOT node_modules/.prisma — caching
          # packages/database/node_modules/.prisma saved an empty archive and
          # a cache-hit then skipped the explicit generate step entirely.
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.prisma-cache.outputs.cache-hit != 'true'
        run: npm run generate --workspace=@besterp/database

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-build
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: besterp
          POSTGRES_PASSWORD: besterp_dev
          POSTGRES_DB: besterp
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Prisma client
        id: prisma-cache-test
        uses: actions/cache@v4
        with:
          # Root node_modules/.prisma — see the prisma-cache step above.
          path: node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma') }}

      - name: Generate Prisma client
        if: steps.prisma-cache-test.outputs.cache-hit != 'true'
        run: npm run generate --workspace=@besterp/database

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
        # Run via the workspace script so the working directory is
        # packages/database — `npx prisma migrate deploy` from the repo root
        # cannot find the schema (Prisma only checks ./prisma and ./).
        run: npm run migrate:deploy --workspace=@besterp/database

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create app role & RLS policies
        env:
          PGHOST: localhost
          PGPORT: 5434
          PGUSER: besterp
          PGPASSWORD: besterp_dev
          PGDATABASE: besterp
        # ON_ERROR_STOP=1 makes psql exit non-zero on the FIRST failing
        # statement. Without it psql exits 0 even when a statement failed, so
        # a malformed policy (e.g. an unbalanced parenthesis that swallows
        # every subsequent statement) left the database without RLS while CI
        # reported success.
        run: |
          psql -v ON_ERROR_STOP=1 -v app_db_password=besterp_app_dev -f packages/database/prisma/create-roles.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/prisma/rls-setup.sql

      - name: Seed database
        env:
          DATABASE_URL: postgresql://besterp_app:besterp_app_dev@localhost:5434/besterp
          DATABASE_ADMIN_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
          # Opt-in guard required by the seed script (defense-in-depth against
          # seeding a real database). This CI postgres is ephemeral, so it's safe.
          ALLOW_SEED: "1"
        run: npm run db:seed

      - name: Run shared package tests
        run: npm run test --workspace=@besterp/shared

      - name: Run MCP tools unit tests
        run: npm run test --workspace=@besterp/mcp-tools

      - name: Run database integration tests
        env:
          DATABASE_URL: postgresql://besterp_app:besterp_app_dev@localhost:5434/besterp
          DATABASE_ADMIN_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
        run: npm run test --workspace=@besterp/database

      - name: Run API unit tests
        run: npm run test --workspace=@besterp/api
