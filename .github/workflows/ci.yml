name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=@besterp/database

      - name: Build
        run: npm run build

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-build
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: besterp
          POSTGRES_PASSWORD: besterp_dev
          POSTGRES_DB: besterp
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace=@besterp/database

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
        run: npm run migrate --workspace=@besterp/database -- --name init

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create app role & RLS policies
        env:
          PGHOST: localhost
          PGPORT: 5434
          PGUSER: besterp
          PGPASSWORD: besterp_dev
          PGDATABASE: besterp
        run: |
          psql -f packages/database/prisma/create-roles.sql
          psql -f packages/database/prisma/rls-setup.sql

      - name: Seed database
        env:
          DATABASE_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
        run: npm run db:seed

      - name: Run shared package tests
        run: npm run test --workspace=@besterp/shared

      - name: Run MCP tools unit tests
        run: npm run test --workspace=@besterp/mcp-tools

      - name: Run database integration tests
        env:
          DATABASE_URL: postgresql://besterp_app:besterp_app_dev@localhost:5434/besterp
          DATABASE_ADMIN_URL: postgresql://besterp:besterp_dev@localhost:5434/besterp
        run: npm run test --workspace=@besterp/database

      - name: Run API unit tests
        run: npm run test --workspace=@besterp/api
