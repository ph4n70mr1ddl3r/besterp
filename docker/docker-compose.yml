services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: besterp-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: besterp
      POSTGRES_PASSWORD: besterp_dev
      POSTGRES_DB: besterp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besterp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Used for session storage, caching, and rate limiting.
  # Not yet wired in application code. Needed for Phase 0b+.
  redis:
    image: redis:7-alpine
    container_name: besterp-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for file attachments, exports.
  # Not yet wired in application code. Needed for Phase 1+.
  minio:
    image: minio/minio:latest
    container_name: besterp-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
