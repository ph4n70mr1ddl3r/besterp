services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: besterp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: besterp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: besterp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../packages/database/prisma/create-roles.sql:/docker-entrypoint-initdb.d/01-create-roles.sql
      # rls-setup.sql cannot run from initdb.d: at init time the tables created by
      # Prisma migrations do not exist yet, so every ENABLE/FORCE ROW LEVEL SECURITY
      # statement would fail silently. Mount it read-only instead and apply it AFTER
      # `npm run db:migrate` (see README). ON_ERROR_STOP=1 is required: without it psql
      # exits 0 even when a statement fails, so a malformed policy would leave the
      # database without RLS while the command appeared to succeed.
      #   docker exec -i besterp-postgres psql -v ON_ERROR_STOP=1 -U besterp -d besterp -f /setup/rls-setup.sql
      - ../packages/database/prisma/rls-setup.sql:/setup/rls-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besterp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Backed by the BullMQ queue module (QueueModule) and the Redis
  # health probe in HealthService.
  #
  # NOTE: this instance serves PLAINTEXT. The application enables TLS by
  # default in every non-development environment (resolveRedisTls), so a
  # deployment on this stack must set REDIS_TLS=0 (or front the instance with
  # a TLS terminator) — see .env.example.
  redis:
    image: redis:7-alpine
    container_name: besterp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for file attachments, exports.
  # Not yet wired in application code. Needed for Phase 1+.
  minio:
    image: minio/minio:RELEASE.2026-03-12T15-15-27Z
    container_name: besterp-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  miniodata:
  redisdata:
