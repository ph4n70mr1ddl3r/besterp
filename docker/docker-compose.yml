services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: besterp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: besterp
      POSTGRES_PASSWORD: besterp_dev
      POSTGRES_DB: besterp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../packages/database/prisma/create-roles.sql:/docker-entrypoint-initdb.d/01-create-roles.sql
      - ../packages/database/prisma/rls-setup.sql:/docker-entrypoint-initdb.d/02-rls-setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besterp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — Used for session storage, caching, and rate limiting.
  # Not yet wired in application code. Needed for Phase 0b+.
  redis:
    image: redis:7-alpine
    container_name: besterp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for file attachments, exports.
  # Not yet wired in application code. Needed for Phase 1+.
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: besterp-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  miniodata:
